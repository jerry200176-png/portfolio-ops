- id: FM-20260829-054949-9PYS
  name: CI and local validation commands run from different repository directories
  detection:
    signal: CI and local validation commands run from different repository directories
    source: reflection:REF-20260829-054949-CF25
  mitigation:
    practice: Run frontend npm scripts from frontend and portfolio Python tests through
