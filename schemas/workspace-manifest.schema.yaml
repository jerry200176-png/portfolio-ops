schema_version: 1
format: JSON-compatible YAML
required_fields: [schema_version, workspace_root, paths, repositories]
paths_required: [bare_repos, canonical_checkouts, active_worktrees, tasks, archives, evidence, backups, agent_control, control_plane]
repository_required: [id, path, role, remote, branch_policy, mutation_policy, approval_for_archive_or_remove]
rules:
  - canonical_checkouts are stable integration points.
  - active_worktrees are the default location for branch work.
  - archives, evidence, and backups are never auto-deleted.
  - remote synchronization is fetch-only unless a separate approval exists.
