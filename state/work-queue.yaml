  - id: OPS-ALLTRUE-2002
    product: alltrue
    priority: p1
    title: Make cross-date rescheduled sessions visible in the teacher calendar
    source: https://github.com/jerry200176-png/AllTrue_System/issues/2002
    status: needs_design_and_founder_gate
    evidence:
      - "Issue #2002 reports a live-shaped case where schedules contains a rescheduled-to scheduled row for a cross-date move, but the corresponding ClassSession is absent; the calendar therefore shows a false free slot while availability reads the schedule row as busy."
      - "Current ClassSessionController read-side repair only handles same-day ranges and explicitly skips a cross-date original_schedule_id chain to avoid creating a duplicate ghost occurrence."
      - "Existing tests cover stale same-day exception occupancy and cross-date schedule write deferral, but do not prove the teacher calendar read model renders or safely resolves a cross-date scheduled exception with no materialized ClassSession."
    root_cause: "The scheduling and calendar read models still have different completeness boundaries for legacy cross-date reschedule chains: schedules can be authoritative for occupancy while ClassSession remains the calendar display source."
    non_goals:
      - "Do not bulk-materialize or mutate production sessions from a read-only investigation."
      - "Do not choose between rendering a projection and materializing a ClassSession until duplicate/stale-chain semantics are specified and reviewed."
    tests:
      - "Read-only source audit of ClassSessionController, ScheduleController, ScheduleGuardService, and calendar projection merge tests."
      - "Existing backend regression coverage: StaleScheduleExceptionBusyTest and ScheduleStoreOrphanPreventionTest."
    proposal: reports/2026-08-27/alltrue-cross-date-calendar-proposal.md
    rollback: "No product change in this queue entry; any future implementation must use an isolated PR with an explicit rollback plan and post-deploy calendar/availability verification."
    dependencies:
      - "Architecture decision: canonical display contract for cross-date reschedule targets (projection versus safe idempotent materialization)."
      - "Independent review and Founder approval before scheduling/read-model production changes."
    founder_gate: "Founder/reviewer must approve the contract and production rollout; any data repair remains a separately audited operation."
    acceptance:
      - "A valid cross-date rescheduled target appears exactly once in the teacher calendar and remains consistent with availability occupancy."
      - "Stale, cancelled, duplicate, and makeup-only schedule rows remain hidden or classified according to the reviewed contract."
      - "A regression test proves no false-free slot and no duplicate calendar occurrence."
    next_action: "Review reports/2026-08-27/alltrue-cross-date-calendar-proposal.md and request the Founder gate before implementation."

