name: Rulebook check (reusable)

# Product repos call this with one line of YAML:
#   jobs:
#     rulebook:
#       uses: jerry200176-png/portfolio-ops/.github/workflows/rulebook-check.yml@<40-hex portfolio-ops sha>
on:
  workflow_call:
    inputs:
      remote:
        description: Also compare governance/RULEBOOK.md with the pinned portfolio-ops commit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rulebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Rulebook pin, adapters and retired rule text
        run: python3 scripts/check-rulebook.py ${{ inputs.remote && '--remote' || '' }}
