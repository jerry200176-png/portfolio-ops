name: Weekly governance freshness report

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-warn-script-location pyyaml==6.0.2
      - name: Generate freshness report
        run: python scripts/portfolio-freshness.py --github-summary --json-out "$RUNNER_TEMP/portfolio-freshness.json"
      - name: Upload freshness evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: portfolio-freshness
          path: ${{ runner.temp }}/portfolio-freshness.json
