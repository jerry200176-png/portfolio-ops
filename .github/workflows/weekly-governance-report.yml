name: Weekly governance freshness report

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-warn-script-location pyyaml==6.0.2
      - name: Generate freshness report
        # Scheduled/manual monitor remains fail-closed on stale inventory/evidence.
        run: python scripts/portfolio-freshness.py --fail-on-stale --github-summary --json-out "$RUNNER_TEMP/portfolio-freshness.json"
      - name: Probe production identity
        if: always()
        env:
          # Repository-scoped token; private product evidence stays UNKNOWN
          # unless this workflow already has read access. No cross-repo secret.
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-production-identity.py --fail-on-unhealthy --github-summary --json-out "$RUNNER_TEMP/production-identity.json"
      - name: Upload freshness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-freshness
          path: |
            ${{ runner.temp }}/portfolio-freshness.json
            ${{ runner.temp }}/production-identity.json
          if-no-files-found: error
