name: Rulebook sync

# After the rulebook, vendored skills, check script or PR template change on main, open/update an
# R0 sync PR in every repo with governance_sync: true in portfolio.yaml (scripts/sync-governance.py).
# Skips cleanly when the GOVERNANCE_SYNC_TOKEN secret is absent. See docs/governance-sync.md.
on:
  push:
    branches: [main]
    paths:
      - governance/RULEBOOK.md
      - .claude/skills/reference-first-design/**
      - .claude/skills/product-design-doc/**
      - scripts/check-rulebook.py
      - governance/templates/pull_request_template.md
      - portfolio.yaml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rulebook-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GOVERNANCE_SYNC_TOKEN: ${{ secrets.GOVERNANCE_SYNC_TOKEN }}
    steps:
      - name: Check secret
        id: gate
        run: |
          if [ -z "$GOVERNANCE_SYNC_TOKEN" ]; then
            echo "GOVERNANCE_SYNC_TOKEN not set; skipping sync (docs/governance-sync.md)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Open sync PRs
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_SYNC_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.2
          python scripts/sync-governance.py --sha "$GITHUB_SHA"
