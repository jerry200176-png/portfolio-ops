name: Governance CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Needed so freshness ownership detection can three-dot diff vs PR base
          # (or push before SHA) without skipping the freshness report itself.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-warn-script-location pyyaml==6.0.2
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate governance contracts
        run: python scripts/validate-governance-contract.py
      - name: Discover repository inventory
        run: bash scripts/workspace-inventory.sh "$RUNNER_TEMP/workspace-inventory.tsv" "$GITHUB_WORKSPACE"
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check agent-control shell syntax
        run: bash -n agent-control/bin/agent-start agent-control/bin/portfolio-agent-start agent-control/bootstrap/*.sh scripts/install-agent-control.sh
      - name: Check whitespace
        run: git diff --check

      - name: Validate company agent contract
        run: python scripts/validate-company-agent-contract.py
      - name: Validate company context
        run: python scripts/company-context.py --check
      - name: Validate freshness report
        env:
          # PRs: compare against the PR base. Pushes to main: compare against the
          # pre-push OID. Null before OID fails closed inside the script.
          FRESHNESS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >
          python scripts/portfolio-freshness.py
          --github-summary
          --fail-on-stale-when-inventory-changed
          --diff-base "$FRESHNESS_DIFF_BASE"
          --json-out "$RUNNER_TEMP/portfolio-freshness.json"
      - name: Check production identity script syntax
        run: python -m py_compile scripts/check-production-identity.py scripts/portfolio-freshness.py
