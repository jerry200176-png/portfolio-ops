# ExoProtocol Governance Check
# This workflow is a manual Exo experiment. It is not a fleet PR gate.

name: ExoProtocol Governance

# Manual-only experiment workflow. It is not a fleet PR gate and must not be
# added to the required checks in GitHub rulesets.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA to compare
        required: true
        type: string
      head_sha:
        description: Exact candidate commit SHA to compare
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate selected commits
        env:
          EXO_BASE_SHA: ${{ inputs.base_sha }}
          EXO_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXO_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXO_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXO_HEAD_SHA"
          git cat-file -e "${EXO_BASE_SHA}^{commit}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install ExoProtocol
        run: pip install exoprotocol==0.2.3

      - name: Requirement + acceptance criteria traceability
        if: hashFiles('.exo/requirements.yaml') != ''
        run: python3 -m exo.cli trace-reqs --check-tests

      - name: PR governance check
        env:
          EXO_BASE_SHA: ${{ inputs.base_sha }}
          EXO_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python3 -m exo.cli pr-check \
            --base "$EXO_BASE_SHA" \
            --head "$EXO_HEAD_SHA" \
            --drift-threshold 0.7

      - name: Save governance report
        if: always()
        env:
          EXO_BASE_SHA: ${{ inputs.base_sha }}
          EXO_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python3 -m exo.cli --format json pr-check \
            --base "$EXO_BASE_SHA" \
            --head "$EXO_HEAD_SHA" \
            --drift-threshold 0.7 \
            > exo-governance-report.json || true

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exo-governance-report
          path: exo-governance-report.json
          retention-days: 30

      - name: Run governed checks
        run: |
          if [ -f package.json ]; then npm test && npm run lint; fi
          if [ -f pytest.ini ] || [ -f pyproject.toml ] || compgen -G "tests/test_*.py" > /dev/null 2>&1; then
            pip install -q pytest
            python3 -m pytest
          fi
