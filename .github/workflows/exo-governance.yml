# ExoProtocol Governance Check
# Auto-generated by: exo adapter-generate --target ci
# Governance hash: f45f0f00b0698aa4...
#
# This workflow runs `exo pr-check` on every pull request to verify that
# all commits are covered by governed sessions, scope is respected, and
# drift scores are within threshold.

name: ExoProtocol Governance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install ExoProtocol
        run: pip install exoprotocol==0.2.3

      - name: Requirement + acceptance criteria traceability
        if: hashFiles('.exo/requirements.yaml') != ''
        run: python3 -m exo.cli trace-reqs --check-tests

      - name: PR governance check
        run: |
          python3 -m exo.cli pr-check \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --drift-threshold 0.7

      - name: Save governance report
        if: always()
        run: |
          python3 -m exo.cli --format json pr-check \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --drift-threshold 0.7 \
            > exo-governance-report.json || true

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: exo-governance-report
          path: exo-governance-report.json
          retention-days: 30

      - name: Run governed checks
        run: |
          if [ -f package.json ]; then npm test && npm run lint; fi
          if [ -f pytest.ini ] || [ -f pyproject.toml ] || compgen -G "tests/test_*.py" > /dev/null 2>&1; then
            pip install -q pytest
            python3 -m pytest
          fi
